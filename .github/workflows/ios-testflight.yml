name: iOS TestFlight

# Manual trigger only. TestFlight uploads are deliberate, not every-push.
# Run from the Actions tab: "Run workflow".
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's in this build (shown to internal testers)"
        required: false
        default: "Alpha RC1 candidate"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  # Must match project.godot / the engine used for testing.
  GODOT_VERSION: "4.7.2-stable"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"
  EXPORT_PRESET: "iOS"
  IOS_PROFILE_ID: "JSMZL49YPG"

jobs:
  build:
    # App Store Connect currently requires iOS apps to be built with Xcode 26+.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release credentials
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
          CERTIFICATE: ${{ secrets.DIST_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BUNDLE_ID ISSUER_ID KEY_ID PRIVATE_KEY TEAM_ID CERTIFICATE CERTIFICATE_PASSWORD; do
            test -n "${!name}" || { echo "::error::$name is not configured"; exit 1; }
          done
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || { echo "::error::IOS_BUNDLE_ID is invalid"; exit 1; }
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPSTORE_TEAM_ID must be 10 characters"; exit 1; }

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Godot + templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/Godot.app
            ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-macos

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          curl -fL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/godot"
          unzip -q godot.zip -d "$HOME/godot"
          tdir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$tdir"
          unzip -q templates.tpz -d templates_extracted
          mv templates_extracted/templates/* "$tdir/"

      - name: Verify Godot and iOS template
        run: |
          set -euo pipefail
          godot_bin="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          test -x "$godot_bin" || { echo "::error::Godot executable not found at $godot_bin"; exit 1; }
          "$godot_bin" --version
          template_root="$HOME/Library/Application Support/Godot/export_templates"
          ios_template="$(find "$template_root" -maxdepth 2 -name 'ios.zip' -type f | head -1)"
          test -n "$ios_template" || { echo "::error::iOS export template not found under $template_root"; exit 1; }
          echo "IOS_TEMPLATE=$ios_template" >> "$GITHUB_ENV"
          ls -lh "$ios_template"

      - name: Inject Apple identifiers into export preset
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_ID" || { echo "::error::repo variable IOS_BUNDLE_ID is not set"; exit 1; }
          test -n "$TEAM_ID"   || { echo "::error::secret APPSTORE_TEAM_ID is not set"; exit 1; }
          /usr/bin/sed -i '' \
            -e "s#^custom_template/release=.*#custom_template/release=\"${IOS_TEMPLATE}\"#" \
            -e "s#^application/bundle_identifier=.*#application/bundle_identifier=\"${BUNDLE_ID}\"#" \
            -e "s#^application/app_store_team_id=.*#application/app_store_team_id=\"${TEAM_ID}\"#" \
            -e 's#^application/name=.*#application/name="Indie Empire"#' \
            -e "s#^application/version=.*#application/version=\"${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}\"#" \
            export_presets.cfg
          grep -E '^(custom_template/release|application/(bundle_identifier|app_store_team_id|name|version))=' export_presets.cfg

      - name: TestFlight preflight
        run: python3 ci/validate_ios_release.py --ci

      - name: Import project
        run: |
          set -euo pipefail
          godot_bin="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          "$godot_bin" --headless --path . --import || "$godot_bin" --headless --path . --import

      - name: Export Xcode project
        run: |
          set -euo pipefail
          godot_bin="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          rm -rf build/ios && mkdir -p build/ios
          # Godot treats this path as "<folder>/<project name>" and writes
          # <name>.xcodeproj plus sources into the folder; the exact bundle name
          # is not worth predicting, so locate it afterwards.
          "$godot_bin" --headless --path . --export-release "${EXPORT_PRESET}" \
            "$(pwd)/build/ios/IndieEmpire"
          ls -la build/ios
          xcodeproj="$(find build/ios -maxdepth 2 -name '*.xcodeproj' -type d | head -1)"
          test -n "$xcodeproj" || { echo "::error::Godot produced no .xcodeproj"; exit 1; }
          echo "XCODEPROJ=$xcodeproj" >> "$GITHUB_ENV"
          echo "Xcode project: $xcodeproj"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Write App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.APPSTORE_PRIVATE_KEY }}" > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Install App Store provisioning profile
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/IndieEmpire.mobileprovision"
          profile_plist="$RUNNER_TEMP/IndieEmpire-profile.plist"
          ruby ci/download_appstore_profile.rb \
            "$RUNNER_TEMP/asc/AuthKey.p8" \
            "${{ secrets.APPSTORE_KEY_ID }}" \
            "${{ secrets.APPSTORE_ISSUER_ID }}" \
            "$IOS_PROFILE_ID" \
            "$profile"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "Installed profile: $profile_name ($profile_uuid)"

      - name: Resolve scheme
        id: scheme
        run: |
          set -euo pipefail
          scheme="$(xcodebuild -project "$XCODEPROJ" -list -json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')"
          echo "name=$scheme" >> "$GITHUB_OUTPUT"
          echo "Scheme: $scheme"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -project "$XCODEPROJ" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/IndieEmpire.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPSTORE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Export .ipa
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          sed \
            -e "s/__TEAM_ID__/${{ secrets.APPSTORE_TEAM_ID }}/" \
            -e "s/__BUNDLE_ID__/${BUNDLE_ID}/" \
            -e "s/__PROFILE_UUID__/${PROFILE_UUID}/" \
            ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/IndieEmpire.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"
          ls -la "$RUNNER_TEMP/export"
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)"
          test -n "$ipa" || { echo "::error::no .ipa produced"; exit 1; }
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          release-notes: ${{ inputs.notes }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"
